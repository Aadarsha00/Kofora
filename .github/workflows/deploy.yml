name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.VPS_DEPLOY_PATH }}"

            cd "$APP_DIR"
            git pull origin main
            npm ci
            npm run build
            sudo chown -R www-data:www-data "$APP_DIR/.next"

            sudo cp deployment/systemd/kofora-frontend.service /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable kofora-frontend
            sudo systemctl restart kofora-frontend
